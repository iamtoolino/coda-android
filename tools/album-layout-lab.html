<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coda Album Layout Lab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --brand: #2b7a82;
      --gold: #d19433;
      --surface: #17191c;
      --surface-raised: #202328;
      --border: #343940;
      --text: #f4f2ef;
      --muted: #9ba1a8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 18% -10%, rgba(43, 122, 130, .22), transparent 42rem),
        #0d0f11;
    }
    main { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: 44px 0 64px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 34px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.04em; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    .target { margin-top: 7px; font: 600 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: #b9d9dc; }
    button { font: inherit; }
    .open-button, .secondary {
      border: 1px solid var(--border); border-radius: 999px; color: var(--text); cursor: pointer;
      background: rgba(32, 35, 40, .82); padding: 11px 17px; white-space: nowrap;
    }
    .open-button:hover, .secondary:hover { background: #2a2e34; }
    section { margin-top: 30px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; margin-bottom: 13px; }
    h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
    .hint { font-size: 13px; color: var(--muted); }
    .layout-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .layout-card {
      display: block; position: relative; padding: 18px; min-height: 132px; text-align: left;
      border: 1px solid var(--border); border-radius: 18px; background: rgba(23, 25, 28, .88);
      color: var(--text); cursor: pointer; transition: border-color 140ms, background 140ms, transform 140ms;
    }
    .layout-card:hover { transform: translateY(-1px); border-color: #4b535c; }
    .layout-card[aria-pressed="true"] { border-color: #63aab1; background: rgba(43, 122, 130, .17); }
    .layout-card[aria-pressed="true"]::after {
      content: "✓"; position: absolute; top: 16px; right: 17px; width: 25px; height: 25px;
      display: grid; place-items: center; border-radius: 50%; background: var(--brand); font-weight: 800;
    }
    .layout-name { display: block; font-weight: 750; font-size: 17px; margin-bottom: 8px; }
    .layout-description { display: block; max-width: 34ch; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .controls {
      border: 1px solid var(--border); border-radius: 18px; background: rgba(23, 25, 28, .88);
      padding: 7px 20px;
    }
    .control { display: grid; grid-template-columns: 185px 1fr 62px; align-items: center; gap: 18px; padding: 19px 0; }
    .control + .control { border-top: 1px solid #2d3137; }
    label { font-weight: 650; }
    output { text-align: right; color: #cbd0d5; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: #63aab1; cursor: ew-resize; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 24px; }
    .status { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #64707a; }
    .status[data-state="working"] .status-dot { background: var(--gold); }
    .status[data-state="ok"] .status-dot { background: #67b77a; }
    .status[data-state="error"] { color: #ef9b96; }
    .status[data-state="error"] .status-dot { background: #e16961; }
    @media (max-width: 650px) {
      main { width: min(100% - 26px, 920px); padding-top: 28px; }
      header { flex-direction: column; }
      .layout-grid { grid-template-columns: 1fr; }
      .control { grid-template-columns: 1fr 58px; gap: 9px 16px; }
      .control input { grid-column: 1 / -1; grid-row: 2; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Album Layout Lab</h1>
        <p>Choose a composition, then tune controls while watching Coda in the emulator.</p>
        <div class="target">Target: __TARGET_SERIAL__</div>
      </div>
      <button class="open-button" id="openCoda" type="button">Open Coda</button>
    </header>

    <section aria-labelledby="layout-title">
      <div class="section-heading">
        <h2 id="layout-title">Composition</h2>
        <span class="hint">Changes apply immediately</span>
      </div>
      <div class="layout-grid" id="layouts">
        <button class="layout-card" type="button" data-layout="below_artwork" aria-pressed="true">
          <span class="layout-name">Controls first</span>
          <span class="layout-description">Buttons and backed rating share a row directly below the artwork.</span>
        </button>
        <button class="layout-card" type="button" data-layout="metadata_first" aria-pressed="false">
          <span class="layout-name">Metadata first</span>
          <span class="layout-description">Album identity leads; actions follow as one compact control row.</span>
        </button>
        <button class="layout-card" type="button" data-layout="artwork_overlay" aria-pressed="false">
          <span class="layout-name">Artwork overlay</span>
          <span class="layout-description">Returns buttons and the backed stars to the lower edge of the cover.</span>
        </button>
        <button class="layout-card" type="button" data-layout="macos_stack" aria-pressed="false">
          <span class="layout-name">Coda stack</span>
          <span class="layout-description">Metadata, rating, and compact buttons form a vertical macOS-inspired hierarchy.</span>
        </button>
      </div>
    </section>

    <section aria-labelledby="position-title">
      <div class="section-heading">
        <h2 id="position-title">Vertical position</h2>
        <span class="hint">Negative values move upward</span>
      </div>
      <div class="controls">
        <div class="control">
          <label for="buttonsOffset">Play &amp; queue buttons</label>
          <input id="buttonsOffset" type="range" min="-96" max="96" step="1" value="0">
          <output id="buttonsValue" for="buttonsOffset">0 dp</output>
        </div>
        <div class="control">
          <label for="ratingOffset">Rating capsule</label>
          <input id="ratingOffset" type="range" min="-96" max="96" step="1" value="0">
          <output id="ratingValue" for="ratingOffset">0 dp</output>
        </div>
      </div>
    </section>

    <footer>
      <div class="status" id="status" data-state="idle" role="status" aria-live="polite">
        <span class="status-dot"></span><span id="statusText">Connecting…</span>
      </div>
      <button class="secondary" id="reset" type="button">Reset positions</button>
    </footer>
  </main>

  <script>
    const model = { layout: "below_artwork", buttonsOffsetDp: 0, ratingOffsetDp: 0 };
    const layoutButtons = [...document.querySelectorAll("[data-layout]")];
    const buttonsOffset = document.querySelector("#buttonsOffset");
    const ratingOffset = document.querySelector("#ratingOffset");
    const buttonsValue = document.querySelector("#buttonsValue");
    const ratingValue = document.querySelector("#ratingValue");
    const status = document.querySelector("#status");
    const statusText = document.querySelector("#statusText");
    let applyTimer;
    let requestRevision = 0;

    function render() {
      layoutButtons.forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.layout === model.layout));
      });
      buttonsOffset.value = model.buttonsOffsetDp;
      ratingOffset.value = model.ratingOffsetDp;
      buttonsValue.textContent = `${model.buttonsOffsetDp} dp`;
      ratingValue.textContent = `${model.ratingOffsetDp} dp`;
    }

    function setStatus(state, text) {
      status.dataset.state = state;
      statusText.textContent = text;
    }

    async function apply() {
      const revision = ++requestRevision;
      setStatus("working", "Applying…");
      try {
        const response = await fetch("/api/tuning", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(model),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not apply layout");
        if (revision === requestRevision) setStatus("ok", "Live on __TARGET_SERIAL__");
      } catch (error) {
        if (revision === requestRevision) setStatus("error", error.message || String(error));
      }
    }

    function scheduleApply() {
      clearTimeout(applyTimer);
      applyTimer = setTimeout(apply, 70);
    }

    layoutButtons.forEach(button => button.addEventListener("click", () => {
      model.layout = button.dataset.layout;
      render();
      scheduleApply();
    }));
    buttonsOffset.addEventListener("input", () => {
      model.buttonsOffsetDp = Number(buttonsOffset.value);
      render();
      scheduleApply();
    });
    ratingOffset.addEventListener("input", () => {
      model.ratingOffsetDp = Number(ratingOffset.value);
      render();
      scheduleApply();
    });
    document.querySelector("#reset").addEventListener("click", () => {
      model.buttonsOffsetDp = 0;
      model.ratingOffsetDp = 0;
      render();
      scheduleApply();
    });
    document.querySelector("#openCoda").addEventListener("click", async () => {
      setStatus("working", "Opening Coda…");
      try {
        const response = await fetch("/api/open-coda", { method: "POST" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not open Coda");
        setStatus("ok", "Coda opened");
      } catch (error) {
        setStatus("error", error.message || String(error));
      }
    });

    (async function initialize() {
      try {
        const response = await fetch("/api/state");
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not read state");
        Object.assign(model, result);
        render();
        await apply();
      } catch (error) {
        setStatus("error", error.message || String(error));
      }
    })();
  </script>
</body>
</html>
