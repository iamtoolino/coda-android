<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coda Now Playing Lab</title>
  <style>
    :root { color-scheme:dark; font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --surface:#151719; --border:#34393e; --text:#e8e3df; --muted:#999591; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--text); background:radial-gradient(circle at 20% 0,rgba(43,122,130,.24),transparent 42rem),#050607; }
    main { width:min(920px,calc(100% - 36px)); padding:36px 0; }
    .eyebrow { margin:0 0 12px; color:#b9d9dc; font-size:12px; font-weight:750; letter-spacing:.10em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(32px,7vw,56px); letter-spacing:-.045em; }
    .lead { margin:16px 0 0; max-width:58ch; color:var(--muted); font-size:17px; line-height:1.55; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:30px; }
    .concept { position:relative; min-height:180px; padding:20px; border:1px solid var(--border); border-radius:18px; background:rgba(21,23,25,.88); cursor:pointer; transition:border-color .16s,background .16s,transform .16s; }
    .concept:hover { transform:translateY(-1px); border-color:#566169; }
    .concept[data-selected="true"] { border-color:#75b5bc; background:rgba(28,45,48,.92); box-shadow:0 0 0 1px rgba(117,181,188,.18) inset; }
    .concept strong { display:block; margin-bottom:8px; font-size:19px; }
    .concept p { margin:0; color:var(--muted); line-height:1.45; }
    .concept .number { display:inline-flex; min-width:25px; height:25px; align-items:center; justify-content:center; margin-bottom:18px; border-radius:999px; color:#b9d9dc; background:#20282a; font-size:12px; font-weight:800; }
    .stress { display:flex; align-items:center; gap:8px; margin-top:18px; padding:8px; border:1px solid var(--border); border-radius:16px; background:rgba(21,23,25,.72); }
    .stress-label { margin:0 8px; color:var(--muted); font-size:13px; font-weight:700; }
    .stress button { padding:8px 12px; border-radius:10px; font-size:13px; }
    .stress button[data-selected="true"] { color:#071012; border-color:#75b5bc; background:#75b5bc; }
    .footer { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-top:24px; }
    .target { font:600 13px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; color:#b9d9dc; }
    button { border:1px solid var(--border); border-radius:999px; padding:11px 17px; color:var(--text); background:#202326; font:inherit; cursor:pointer; }
    #status { min-height:20px; margin-top:12px; color:var(--muted); font-size:13px; }
    #status[data-error="true"] { color:#ef9b96; }
    @media (max-width:640px) { .grid{grid-template-columns:1fr}.footer{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">OLED Instrument baseline accepted</p>
    <h1>Now Playing lab</h1>
    <p class="lead">Compare five focused treatments for the area below the rating. Artwork, fading, color extraction, metadata, and rating stay unchanged.</p>
    <div class="grid" aria-label="Now Playing concepts">
      <button class="concept" type="button" data-prototype="baseline">
        <span class="number">0</span>
        <strong>OLED Instrument baseline</strong>
        <p>The current queue preview, three transport controls, and inline technical string.</p>
      </button>
      <button class="concept" type="button" data-prototype="instrument-rail">
        <span class="number">1</span>
        <strong>Instrument Rail</strong>
        <p>Queue, previous, play, next, and signal form one precise five-key console.</p>
      </button>
      <button class="concept" type="button" data-prototype="quiet-dock">
        <span class="number">2</span>
        <strong>Quiet Dock</strong>
        <p>Classic transport remains dominant; Queue and stream state become restrained utility capsules.</p>
      </button>
      <button class="concept" type="button" data-prototype="immersive-utilities">
        <span class="number">3</span>
        <strong>Immersive Utilities</strong>
        <p>The body keeps only transport. Queue and signal float at the artwork's fading edge.</p>
      </button>
      <button class="concept" type="button" data-prototype="queue-deck">
        <span class="number">4</span>
        <strong>Queue Deck</strong>
        <p>A thin Up next strip anchors the bottom and expands into a combined playback-session sheet.</p>
      </button>
      <button class="concept" type="button" data-prototype="session-button">
        <span class="number">5</span>
        <strong>Session Button</strong>
        <p>Only transport remains in the body; one quiet artwork-edge button reveals every secondary detail.</p>
      </button>
      <button class="concept" type="button" data-prototype="quiet-dock-wide">
        <span class="number">6</span>
        <strong>Quiet Dock Wide</strong>
        <p>Quiet Dock gains equal-width utility capsules and an elastic metadata block supporting three title lines.</p>
      </button>
    </div>
    <div class="stress" aria-label="Title stress test">
      <p class="stress-label">Title stress</p>
      <button type="button" data-title-stress="actual">Actual</button>
      <button type="button" data-title-stress="two-lines">Two lines</button>
      <button type="button" data-title-stress="three-lines">Three lines</button>
    </div>
    <div class="footer">
      <div class="target">Target: __TARGET_SERIAL__</div>
      <button id="openCoda" type="button">Open Coda</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const status=document.querySelector("#status");
    const concepts=[...document.querySelectorAll("[data-prototype]")];
    const titleStressButtons=[...document.querySelectorAll("[data-title-stress]")];
    const selectPrototype=async(prototype)=>{
      status.dataset.error="false";status.textContent="Applying concept…";
      try{
        const response=await fetch("/api/prototype",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prototype})});
        const result=await response.json();if(!response.ok)throw new Error(result.error||"Could not apply concept");
        concepts.forEach(card=>card.dataset.selected=String(card.dataset.prototype===prototype));
        status.textContent="Concept applied on __TARGET_SERIAL__.";
      }catch(error){status.dataset.error="true";status.textContent=error.message||String(error)}
    };
    concepts.forEach(card=>card.addEventListener("click",()=>selectPrototype(card.dataset.prototype)));
    const initialPrototype="__CURRENT_PROTOTYPE__";
    concepts.forEach(card=>card.dataset.selected=String(card.dataset.prototype===initialPrototype));
    const selectTitleStress=async(titleStress)=>{
      status.dataset.error="false";status.textContent="Applying title test…";
      try{
        const response=await fetch("/api/title-stress",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({titleStress})});
        const result=await response.json();if(!response.ok)throw new Error(result.error||"Could not apply title test");
        titleStressButtons.forEach(button=>button.dataset.selected=String(button.dataset.titleStress===titleStress));
        status.textContent="Title test applied on __TARGET_SERIAL__.";
      }catch(error){status.dataset.error="true";status.textContent=error.message||String(error)}
    };
    titleStressButtons.forEach(button=>button.addEventListener("click",()=>selectTitleStress(button.dataset.titleStress)));
    const initialTitleStress="__CURRENT_TITLE_STRESS__";
    titleStressButtons.forEach(button=>button.dataset.selected=String(button.dataset.titleStress===initialTitleStress));
    document.querySelector("#openCoda").addEventListener("click",async()=>{
      status.dataset.error="false";status.textContent="Opening Coda…";
      try{const response=await fetch("/api/open-coda",{method:"POST"}),result=await response.json();if(!response.ok)throw new Error(result.error||"Could not open Coda");status.textContent="Coda opened on __TARGET_SERIAL__."}
      catch(error){status.dataset.error="true";status.textContent=error.message||String(error)}
    });
  </script>
</body>
</html>
